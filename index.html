<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TXT Document</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            color: #333;
        }
        #content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div id="content">Loading live text file...</div>

    <script>
        // Paste your confirmed Google Drive ID here:
        const GOOGLE_FILE_ID = '1IFSlOtUmVBgS1zxQNA1-nOYuL5EsIaVV'; 

        async function loadText() {
            try {
                // The new direct usercontent link format that bypasses the Google blocks
                const targetUrl = `https://usercontent.com{GOOGLE_FILE_ID}&export=download`;
                
                // Wrap it in the CORS proxy
                const proxyUrl = `https://corsproxy.io{encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Network response failed');
                
                const text = await response.text();
                document.getElementById('content').textContent = text;
            } catch (error) {
                console.error(error);
                document.getElementById('content').textContent = 'Failed to load content. Connecting to Google Drive...';
            }
        }

        loadText();
        // Checks for your 3rd party app updates every 60 seconds
        setInterval(loadText, 60000);
    </script>
</body>
</html>
