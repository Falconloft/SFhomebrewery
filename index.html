<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TXT Document</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            color: #333;
        }
        #content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
    <!-- Include Puter.js to strip all CORS blocks automatically -->
    <script src="https://puter.com"></script>
</head>
<body>

    <div id="content">Loading live text file from Google Drive...</div>

    <script>
        // Paste your validated Google Drive ID here
        const GOOGLE_FILE_ID = '1IFSlOtUmVBgS1zxQNA1-nOYuL5EsIaVV'; 

        function loadText() {
            // Standard direct download url format
            const targetUrl = `https://google.com{GOOGLE_FILE_ID}`;

            // Puter bypasses browser cross-origin policy natively
            puter.js.fetch(targetUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.text();
                })
                .then(text => {
                    // Render the text successfully onto your site
                    document.getElementById('content').textContent = text;
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('content').textContent = 'Failed to load content. Confirm the Drive file is set to "Anyone with the link".';
                });
        }

        // Run as soon as the library finishes initialization
        puter.ready().then(loadText);

        // Fetch updates every 60 seconds from your third-party software edits
        setInterval(loadText, 60000);
    </script>
</body>
</html>
