<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TXT Document</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            color: #333;
        }
        #content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div id="content">Loading live text file...</div>

    <script>
        // 1. Paste your Google Drive ID here:
        const GOOGLE_FILE_ID = 'PASTE_YOUR_FILE_ID_HERE'; 

        async function loadText() {
            try {
                // The raw Google Drive download URL
                const targetUrl = `https://google.com{1IFSlOtUmVBgS1zxQNA1-nOYuL5EsIaVV}`;
                
                // Routes the request through a proxy to bypass Google's security wall
                const proxyUrl = `https://allorigins.win{encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // Places the unblocked text onto your webpage
                document.getElementById('content').textContent = data.contents;
            } catch (error) {
                console.error(error);
                document.getElementById('content').textContent = 'Failed to load content. Ensure the file in Drive is shared.';
            }
        }

        // Load immediately on page open
        loadText();

        // Check for updates automatically every 60 seconds
        setInterval(loadText, 60000);
    </script>
</body>
</html>
