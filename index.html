<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TXT Document</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            color: #333;
        }
        #content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
    <!-- Puter library to handle the network bypass -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>

    <div id="content">Loading live text file...</div>

    <script>
        // Paste your Google Drive ID here
        const GOOGLE_FILE_ID = '1IFSlOtUmVBgS1zxQNA1-nOYuL5EsIaVV'; 

        async function loadText() {
            try {
                // Direct Google download URL
                const targetUrl = `https://google.com{GOOGLE_FILE_ID}`;

                // Correct Puter function to pull the data CORS-free
                const response = await puter.net.fetch(targetUrl);
                if (!response.ok) throw new Error('Network response failed');
                
                const text = await response.text();
                document.getElementById('content').textContent = text;
            } catch (error) {
                console.error(error);
                document.getElementById('content').textContent = 'Failed to load content. Ensure the file in Drive is shared.';
            }
        }

        // Wait for the library to load, then run immediately
        puter.ready().then(loadText);

        // Check for edits from your 3rd party app every 60 seconds
        setInterval(loadText, 60000);
    </script>
</body>
</html>
