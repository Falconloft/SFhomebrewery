<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Google Drive Text Page</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            color: #333;
        }
        #content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div id="content">Loading live document content...</div>

    <script>
        // 1. paste your long random Google Drive file ID between the quotes below:
        const GOOGLE_FILE_ID = 'PASTE_YOUR_FILE_ID_HERE'; 

        async function loadText() {
            try {
                // This URL forces Google to export the document as plain text
                const url = `https://google.com{1IFSlOtUmVBgS1zxQNA1-nOYuL5EsIaVV}&exportFormat=txt`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const text = await response.text();
                document.getElementById('content').textContent = text;
            } catch (error) {
                console.error(error);
                document.getElementById('content').textContent = 'Failed to load content from Google Drive. Please ensure the file is set to "Anyone with the link can view".';
            }
        }

        // Load the text immediately when the page opens
        loadText();

        // Check for updates automatically every 60 seconds
        setInterval(loadText, 60000);
    </script>
</body>
</html>
