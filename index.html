<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Drive File Viewer</title>
</head>
<body>
  <pre id="file-content">Loading...</pre>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHwhWzJvANvcHvOw2fz8ZhVjBPXBSk3k5L10eIachZpbqNE1dyhoHAYuIOA7kBVQyh/exec';

    fetch(APPS_SCRIPT_URL)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.text();
      })
      .then(text => {
        document.getElementById('file-content').textContent = text;
      })
      .catch(error => {
        document.getElementById('file-content').textContent = 'Error loading file: ' + error.message;
      });
  </script>
</body>
</html>
